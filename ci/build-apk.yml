name: Build Remindly APK

# Two ways to run:
#   1. Manually  - Actions tab -> "Build Remindly APK" -> Run workflow
#   2. On a tag  - git tag v1.73 && git push --tags  (also creates a Release)
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which build to produce"
        required: true
        default: release
        type: choice
        options: [release, debug]
  push:
    tags:
      - "v*"

permissions:
  contents: write        # needed only for the tag-triggered Release step

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      # JDK 21 to match the local toolchain. The Gradle wrapper fetches Gradle itself,
      # so nothing else needs installing.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # Speeds repeat builds from ~6 min to ~2 min.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The keystore is NEVER committed. It lives as a base64 secret and is written
      # to disk only for the length of this job. See the README for how to create it.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. See ci/README-github-actions.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > remindly.keystore
          echo "keystore restored ($(stat -c%s remindly.keystore) bytes)"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Unit tests are a hard gate - the APK is never produced if they fail.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build the APK
        run: |
          TYPE="${{ github.event.inputs.build_type || 'release' }}"
          if [ "$TYPE" = "debug" ]; then
            ./gradlew :app:assembleDebug --console=plain
          else
            ./gradlew :app:assembleRelease --console=plain
          fi

      # Read the version straight out of the built APK so the filename can never
      # disagree with what is actually inside it.
      - name: Identify and rename the APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -r | head -1)
          INFO=$("$AAPT" dump badging "$APK")
          VN=$(echo "$INFO" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          VC=$(echo "$INFO" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          mkdir -p dist
          cp "$APK" "dist/Remindly-v${VN}.apk"
          echo "name=Remindly-v${VN}" >> "$GITHUB_OUTPUT"
          echo "version=${VN}" >> "$GITHUB_OUTPUT"
          echo "### Built Remindly v${VN} (versionCode ${VC})" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $(sha256sum "dist/Remindly-v${VN}.apk" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"

      # Confirms the APK really is signed with your permanent keystore.
      - name: Verify the signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          "$APKSIGNER" verify --print-certs dist/*.apk | grep -i "SHA-1 digest"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          retention-days: 90

      # Only when triggered by a tag - gives you a permanent download link.
      - name: Publish a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
