# Builds, tests, signs and (optionally) publishes the Remindly APK — entirely on GitHub.
#
# Nothing confidential is in the repository. The signing keystore, its passwords, the Google Maps
# key and google-services.json come from repository secrets (Settings → Secrets and variables →
# Actions), are written to the runner only for the duration of the job, and are masked in logs.
#
# Runs:
#   • automatically on a push to main that changes app/build.gradle.kts (a version bump) —
#     builds + tests, and publishes when that version has no GitHub Release yet;
#   • manually: Actions → "Build & release APK" → Run workflow
#       publish = off → build + test only; the APK is attached to the run as an artifact
#       publish = on  → also creates Release v<versionName> and updates releases/version.json
#
# Publishing order is deliberate: the Release asset is uploaded first, the in-app update feed
# (releases/version.json) is committed last — the feed never points at a file that is not there.
name: Build & release APK

on:
  push:
    branches: [main]
    paths: [app/build.gradle.kts]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release and update the in-app update feed"
        type: boolean
        default: false
      run_tests:
        description: "Run the unit tests before building"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Public fingerprint of the permanent Remindly signing certificate (not a secret — it is
      # readable from any installed APK). A build signed with anything else is rejected, because
      # Android would refuse it as an update.
      EXPECTED_CERT_SHA1: a3b944dae20ca23f52d134366422926dff645c55
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from app/build.gradle.kts
        id: v
        run: |
          F=app/build.gradle.kts
          NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$F" | head -1)
          CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$F" | head -1)
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then echo "::error::could not read versionName/versionCode from $F"; exit 1; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "apk=Remindly-$NAME.apk" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          echo "Remindly $NAME (versionCode $CODE)"

      - name: Decide whether to publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          WANT_INPUT: ${{ inputs.publish }}
        run: |
          WANT=false
          if [ "$EVENT" = "push" ] || [ "$WANT_INPUT" = "true" ]; then WANT=true; fi
          PUBLISH=$WANT
          if [ "$WANT" = "true" ]; then
            if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
              echo "::notice::Release ${{ steps.v.outputs.tag }} already exists — building only. Bump the version to publish."
              PUBLISH=false
            fi
            CUR=$(jq -r '.versionCode // 0' releases/version.json 2>/dev/null || echo 0)
            if [ "$PUBLISH" = "true" ] && [ "${{ steps.v.outputs.code }}" -le "$CUR" ]; then
              echo "::notice::versionCode ${{ steps.v.outputs.code }} is not above the published feed ($CUR) — building only."
              PUBLISH=false
            fi
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH"

      - name: Check the repository secrets are configured
        env:
          REMINDLY_KEYSTORE_BASE64: ${{ secrets.REMINDLY_KEYSTORE_BASE64 }}
          REMINDLY_STORE_PASSWORD: ${{ secrets.REMINDLY_STORE_PASSWORD }}
          REMINDLY_KEY_ALIAS: ${{ secrets.REMINDLY_KEY_ALIAS }}
          REMINDLY_KEY_PASSWORD: ${{ secrets.REMINDLY_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          missing=""
          for n in REMINDLY_KEYSTORE_BASE64 REMINDLY_STORE_PASSWORD REMINDLY_KEY_ALIAS REMINDLY_KEY_PASSWORD MAPS_API_KEY GOOGLE_SERVICES_JSON; do
            if [ -z "${!n}" ]; then missing="$missing $n"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — add them in Settings → Secrets and variables → Actions (see docs/GITHUB-ACTIONS.md)."
            exit 1
          fi
          echo "all 6 secrets present"

      - name: Restore signing keystore and google-services.json (runner only, never committed)
        env:
          REMINDLY_KEYSTORE_BASE64: ${{ secrets.REMINDLY_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          umask 077
          printf '%s' "$REMINDLY_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/remindly.keystore"
          echo "keystore restored ($(stat -c%s "$RUNNER_TEMP/remindly.keystore") bytes)"
          # Accept the file contents as pasted, or base64 of it.
          if printf '%s' "$GOOGLE_SERVICES_JSON" | sed -n '/[^[:space:]]/{p;q}' | grep -q '^[[:space:]]*{'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d ' \r\n' | base64 -d > app/google-services.json
          fi
          jq -e '.project_info and .client' app/google-services.json >/dev/null \
            || { echo "::error::GOOGLE_SERVICES_JSON is not a valid google-services.json"; exit 1; }
          echo "google-services.json restored"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unit tests
        if: github.event_name == 'push' || inputs.run_tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Build the signed release APK
        env:
          REMINDLY_STOREFILE: ${{ runner.temp }}/remindly.keystore
          REMINDLY_STOREPASSWORD: ${{ secrets.REMINDLY_STORE_PASSWORD }}
          REMINDLY_KEYALIAS: ${{ secrets.REMINDLY_KEY_ALIAS }}
          REMINDLY_KEYPASSWORD: ${{ secrets.REMINDLY_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify signature and Maps key
        id: apk
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          [ -f "$SRC" ] || { echo "::error::no signed APK at $SRC (was the build unsigned?)"; ls -R app/build/outputs/apk || true; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          CERTS=$("$BT/apksigner" verify --print-certs "$SRC")
          echo "$CERTS" | grep -i "SHA-1 digest"
          WANT=$(echo "$EXPECTED_CERT_SHA1" | tr -d ' :' | tr 'A-F' 'a-f')
          echo "$CERTS" | tr -d ':' | grep -qi "SHA-1 digest $WANT" \
            || { echo "::error::APK is not signed with the permanent Remindly key — phones would refuse it as an update"; exit 1; }
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$SRC" | grep -A3 'com.google.android.geo.API_KEY' | grep -q 'AIza' \
            || { echo "::error::Maps API key missing from the manifest"; exit 1; }
          mkdir -p dist
          cp "$SRC" "dist/${{ steps.v.outputs.apk }}"
          SHA=$(sha256sum "dist/${{ steps.v.outputs.apk }}" | cut -d' ' -f1)
          SIZE=$(stat -c%s "dist/${{ steps.v.outputs.apk }}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "${{ steps.v.outputs.apk }}  $SIZE bytes  sha256 $SHA"

      - name: Attach the APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: Remindly-${{ steps.v.outputs.name }}
          path: dist/${{ steps.v.outputs.apk }}
          retention-days: 30

      - name: Remove secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/remindly.keystore" app/google-services.json

      - name: Release notes
        if: steps.plan.outputs.publish == 'true'
        id: notes
        run: |
          N=docs/RELEASE-NOTES.md
          # Top section = everything before the first "# Previous release" heading.
          awk 'NR>1 && /^# Previous release/{exit} {print}' "$N" > "$RUNNER_TEMP/body.md"
          if ! head -1 "$RUNNER_TEMP/body.md" | grep -q "Remindly ${{ steps.v.outputs.name }}"; then
            echo "::warning::docs/RELEASE-NOTES.md does not start with 'Remindly ${{ steps.v.outputs.name }}' — using a generic note"
            printf '# Remindly %s\n' "${{ steps.v.outputs.name }}" > "$RUNNER_TEMP/body.md"
          fi
          printf '\n---\nInstall: download **%s** below. Installed copies update themselves from Settings → Updates.\n' \
            "${{ steps.v.outputs.apk }}" >> "$RUNNER_TEMP/body.md"
          # One-line summary for the in-app notification: the first paragraph after the heading.
          SHORT=$(awk 'NR==1{next} /^[[:space:]]*$/{if(started)exit; next} {started=1; printf "%s ", $0}' "$RUNNER_TEMP/body.md" \
                  | sed -E 's/\*\*//g; s/[[:space:]]+/ /g; s/ $//' | cut -c1-240)
          [ -n "$SHORT" ] || SHORT="Remindly ${{ steps.v.outputs.name }}"
          printf '%s' "$SHORT" > "$RUNNER_TEMP/short.txt"

      - name: Create the GitHub Release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" "dist/${{ steps.v.outputs.apk }}" \
            --title "Remindly ${{ steps.v.outputs.name }}" \
            --notes-file "$RUNNER_TEMP/body.md" \
            --target "$GITHUB_SHA"

      - name: Update the in-app update feed (releases/version.json)
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}/${{ steps.v.outputs.apk }}"
          jq -n \
            --argjson code "${{ steps.v.outputs.code }}" \
            --arg name "${{ steps.v.outputs.name }}" \
            --arg apk "${{ steps.v.outputs.apk }}" \
            --arg url "$URL" \
            --arg sha "${{ steps.apk.outputs.sha }}" \
            --argjson size "${{ steps.apk.outputs.size }}" \
            --rawfile notes "$RUNNER_TEMP/short.txt" \
            --arg date "$(date -u +%F)" \
            '{versionCode:$code, versionName:$name, apk:$apk, apkUrl:$url, sha256:$sha, sizeBytes:$size, notes:$notes, publishedAt:$date}' \
            > releases/version.json
          cat releases/version.json
          gh release upload "${{ steps.v.outputs.tag }}" releases/version.json --clobber
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/version.json
          git commit -m "Update feed: Remindly ${{ steps.v.outputs.name }} (built by GitHub Actions)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::could not push releases/version.json"; exit 1
