# FALLBACK path — for an APK built and signed locally and committed under releases/.
# The normal path is build-release.yml (GitHub Actions builds, signs and publishes).
# Mirrors releases/version.json + the committed APK into a GitHub Release (tag v<versionName>).
# No secrets, no build. Commits made by build-release.yml do not trigger this workflow.
name: Publish release (locally built APK)
on:
  push:
    branches: [main]
    paths: [releases/version.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "name=$(jq -r .versionName releases/version.json)" >> "$GITHUB_OUTPUT"
          echo "apk=$(jq -r .apk releases/version.json)" >> "$GITHUB_OUTPUT"
          echo "notes=$(jq -r .notes releases/version.json)" >> "$GITHUB_OUTPUT"
      - name: Skip when the APK is not committed (built by Actions instead)
        id: has
        run: |
          if [ -f "releases/${{ steps.v.outputs.apk }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::releases/${{ steps.v.outputs.apk }} not in the repo — nothing to publish here"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Create or update the release
        if: steps.has.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "releases/${{ steps.v.outputs.apk }}" releases/version.json --clobber
          else
            gh release create "$TAG" "releases/${{ steps.v.outputs.apk }}" releases/version.json \
              --title "Remindly ${{ steps.v.outputs.name }}" \
              --notes "${{ steps.v.outputs.notes }}"$'\n\n'"Install: download ${{ steps.v.outputs.apk }}. The app checks releases/version.json for updates." \
              --target "$GITHUB_SHA"
          fi
